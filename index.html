<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>LIFE</title>
<meta name="description" content="A life-management RPG for one player: you.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LIFE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="view"></main>
  <button id="backfab" class="backfab" hidden>← Back</button>
  <nav id="dock">
    <button data-tab="home"><i>⌂</i>HOME</button>
    <button data-tab="me"><i>◉</i>STATUS</button>
    <button data-tab="schedule"><i>◷</i>PLAN</button>
    <button data-tab="portal"><i>☰</i>MENU</button>
  </nav>
</div>
<div id="modal-backdrop"></div>
<div id="modal"><div id="modal-content"></div></div>
<div id="toasts"></div>
<div id="banner"></div>
<noscript>LIFE needs JavaScript.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
